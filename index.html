range ở đối số đầu tiên.", "items": [{"q": "Tổng doanh số Đào tạo tại Cà Mau.", "f": "=SUMIFS(G2:G13;C2:C13;\"Đào tạo\";H2:H13;\"Cà Mau\")", "guide": "Điều kiện C=Đào tạo và H=Cà Mau."}, {"q": "Tổng doanh số Tuyển sinh tại Bạc Liêu.", "f": "=SUMIFS(G2:G13;C2:C13;\"Tuyển sinh\";H2:H13;\"Bạc Liêu\")", "guide": "Ghép hai điều kiện văn bản."}, {"q": "Tổng lương của Hành chính đang làm việc.", "f": "=SUMIFS(E2:E13;C2:C13;\"Hành chính\";M2:M13;\"Đang làm\")", "guide": "Dùng cột E để cộng."}, {"q": "Tổng phụ cấp Kỹ thuật ở Cà Mau.", "f": "=SUMIFS(L2:L13;C2:C13;\"Kỹ thuật\";H2:H13;\"Cà Mau\")", "guide": "Dùng cột L để cộng."}, {"q": "Tổng doanh số nhân viên có điểm Excel >=8 và điểm AI >=8.", "f": "=SUMIFS(G2:G13;I2:I13;\">=8\";J2:J13;\">=8\")", "guide": "Hai tiêu chí số độc lập."}, {"q": "Tổng doanh số Cà Mau có ngày công >=24.", "f": "=SUMIFS(G2:G13;H2:H13;\"Cà Mau\";F2:F13;\">=24\")", "guide": "Điều kiện theo khu vực và ngày công."}, {"q": "Tổng lương người đang làm có ngày công <23.", "f": "=SUMIFS(E2:E13;M2:M13;\"Đang làm\";F2:F13;\"<23\")", "guide": "Kết hợp trạng thái với so sánh số."}, {"q": "Tổng doanh số Tuyển sinh đang làm.", "f": "=SUMIFS(G2:G13;C2:C13;\"Tuyển sinh\";M2:M13;\"Đang làm\")", "guide": "Kiểm tra cả C và M."}, {"q": "Tổng phụ cấp An Giang có điểm AI >=9.", "f": "=SUMIFS(L2:L13;H2:H13;\"An Giang\";J2:J13;\">=9\")", "guide": "Chọn cột L làm sum_range."}, {"q": "Tổng doanh số người có điểm Excel từ 7 đến 9 (bao gồm 7, 9).", "f": "=SUMIFS(G2:G13;I2:I13;\">=7\";I2:I13;\"<=9\")", "guide": "Cùng một cột điều kiện có thể dùng hai lần để tạo khoảng."}]}, {"id": "if", "name": "IF", "group": "Logic", "desc": "Trả về giá trị thứ nhất nếu điều kiện đúng, ngược lại trả về giá trị thứ hai.", "syntax": "IF(logical_test; value_if_true; value_if_false)", "why": "Xếp loại, xét đạt, kiểm tra điều kiện hợp đồng hoặc cảnh báo mức doanh số.", "steps": ["Đặt điều kiện so sánh.", "Quy định kết quả nếu đúng.", "Quy định kết quả nếu sai rồi sao chép công thức xuống các dòng."], "example": "=IF(I2>=5;\"Đạt\";\"Chưa đạt\")", "common": "Kết quả chữ cần được đặt trong dấu ngoặc kép; ô trống và số có cách viết khác.", "items": [{"q": "Xét điểm Excel NV001: từ 5 điểm là Đạt.", "f": "=IF(I2>=5;\"Đạt\";\"Chưa đạt\")", "guide": "So sánh I2 với mốc 5."}, {"q": "Xét điểm AI NV002 từ 8 là Tốt, còn lại Cần cải thiện.", "f": "=IF(J3>=8;\"Tốt\";\"Cần cải thiện\")", "guide": "So sánh J3."}, {"q": "NV003 có doanh số từ 20 triệu thì Thưởng.", "f": "=IF(G4>=20000000;\"Thưởng\";\"Không thưởng\")", "guide": "So sánh G4 với 20 triệu."}, {"q": "NV004 đủ 24 ngày công thì Đủ công.", "f": "=IF(F5>=24;\"Đủ công\";\"Thiếu công\")", "guide": "So sánh F5."}, {"q": "NV005 nếu đang làm thì Hiệu lực.", "f": "=IF(M6=\"Đang làm\";\"Hiệu lực\";\"Ngừng\")", "guide": "So sánh văn bản M6."}, {"q": "NV006 nếu điểm Excel >=8 thì cộng 1 điểm thưởng, không thì 0.", "f": "=IF(I7>=8;1;0)", "guide": "Kết quả là số nên không cần ngoặc kép."}, {"q": "NV007 doanh số >20 triệu thì Xuất sắc.", "f": "=IF(G8>20000000;\"Xuất sắc\";\"Khác\")", "guide": "Dùng dấu >, không bao gồm 20 triệu."}, {"q": "NV008 ở Cà Mau thì Nội tỉnh, ngược lại Ngoài khu vực.", "f": "=IF(H9=\"Cà Mau\";\"Nội tỉnh\";\"Ngoài khu vực\")", "guide": "Điều kiện văn bản ở H9."}, {"q": "NV009 điểm Excel >=9 thì Giỏi.", "f": "=IF(I10>=9;\"Giỏi\";\"Chưa giỏi\")", "guide": "Xét I10."}, {"q": "NV012 nếu ngày công dưới 22 thì Cần theo dõi.", "f": "=IF(F13<22;\"Cần theo dõi\";\"Bình thường\")", "guide": "Dùng điều kiện nhỏ hơn 22."}]}, {"id": "andor", "name": "AND – OR", "group": "Logic", "desc": "AND kiểm tra tất cả điều kiện đúng; OR chỉ cần ít nhất một điều kiện đúng. Thường lồng vào IF.", "syntax": "AND(điều_kiện1;điều_kiện2) / OR(điều_kiện1;điều_kiện2)", "why": "Xét đạt đồng thời hai môn hoặc đủ một trong nhiều điều kiện ưu tiên.", "steps": ["Xác định quy tắc là đồng thời (AND) hay ít nhất một (OR).", "Viết điều kiện bên trong AND/OR.", "Lồng vào IF để có kết quả bằng chữ."], "example": "=IF(AND(I2>=5;J2>=5);\"Đạt\";\"Chưa đạt\")", "common": "AND và OR tự trả TRUE/FALSE; IF dùng để trả nhãn mong muốn.", "items": [{"q": "NV001 phải đạt cả Excel và AI từ 5.", "f": "=IF(AND(I2>=5;J2>=5);\"Đạt\";\"Chưa đạt\")", "guide": "Dùng AND vì yêu cầu đồng thời."}, {"q": "NV002 đạt ít nhất một môn từ 8.", "f": "=IF(OR(I3>=8;J3>=8);\"Được chọn\";\"Không\")", "guide": "OR chỉ cần một điều kiện đúng."}, {"q": "NV003 đủ ngày công >=24 và doanh số >=20 triệu.", "f": "=IF(AND(F4>=24;G4>=20000000);\"Đủ chuẩn\";\"Chưa đủ\")", "guide": "Ghép F4 và G4."}, {"q": "NV004 thuộc Đào tạo hoặc Kỹ thuật.", "f": "=IF(OR(C5=\"Đào tạo\";C5=\"Kỹ thuật\");\"Nhóm chuyên môn\";\"Nhóm khác\")", "guide": "OR với hai tiêu chí văn bản."}, {"q": "NV005 đang làm và điểm AI >=8.", "f": "=IF(AND(M6=\"Đang làm\";J6>=8);\"Đủ điều kiện\";\"Không\")", "guide": "Hai điều kiện cùng đúng."}, {"q": "NV006 ở Cà Mau hoặc An Giang.", "f": "=IF(OR(H7=\"Cà Mau\";H7=\"An Giang\");\"Khu vực ưu tiên\";\"Khác\")", "guide": "OR theo khu vực."}, {"q": "NV007 có điểm Excel và AI đều >=7.", "f": "=IF(AND(I8>=7;J8>=7);\"Đạt chuẩn\";\"Không đạt\")", "guide": "AND theo hai điểm."}, {"q": "NV008 doanh số >=15 triệu hoặc ngày công >=25.", "f": "=IF(OR(G9>=15000000;F9>=25);\"Có ưu tiên\";\"Không\")", "guide": "OR theo số."}, {"q": "NV009 doanh số >15 triệu và điểm Excel >=9.", "f": "=IF(AND(G10>15000000;I10>=9);\"Nổi bật\";\"Khác\")", "guide": "AND gồm doanh số và điểm."}, {"q": "NV012 điểm Excel <5 hoặc điểm AI <5 thì Cần hỗ trợ.", "f": "=IF(OR(I13<5;J13<5);\"Cần hỗ trợ\";\"Đạt\")", "guide": "OR phát hiện một trong hai môn dưới ngưỡng."}]}, {"id": "vlookup", "name": "VLOOKUP", "group": "Tra cứu", "desc": "Tìm theo chiều dọc trong cột đầu tiên của vùng và trả về giá trị ở một cột bên phải.", "syntax": "VLOOKUP(lookup_value; table_array; col_index_num; [range_lookup])", "why": "Tra cứu mã nhân viên, bộ phận, lương, doanh số từ danh mục.", "steps": ["Nhập mã cần tìm (có thể gõ trực tiếp hoặc tham chiếu một ô).", "Chọn toàn bộ bảng từ cột mã A đến cột cần trả.", (G6/F6;0)", "guide": "Tính tỷ lệ trước."}, {"q": "Làm tròn trung bình điểm Excel đến 2 chữ số.", "f": "=ROUND(AVERAGE(I2:I13);2)", "guide": "AVERAGE lồng ROUND."}, {"q": "Làm tròn lương trung bình đến nghìn đồng.", "f": "=ROUND(AVERAGE(E2:E13);-3)", "guide": "Số âm biểu diễn vị trí bên trái dấu thập phân."}, {"q": "Làm tròn tỷ lệ G2/E2 đến 2 chữ số.", "f": "=ROUND(G2/E2;2)", "guide": "Một tỷ lệ số thực."}, {"q": "Làm tròn phụ cấp NV009 đến hàng trăm nghìn.", "f": "=ROUND(L10;-5)", "guide": "Làm tròn L10."}, {"q": "Làm tròn tổng doanh số toàn đơn vị đến triệu đồng.", "f": "=ROUND(SUM(G2:G13);-6)", "guide": "Dùng SUM rồi ROUND."}]}, {"id": "textfunctions", "name": "LEFT – RIGHT – MID", "group": "Xử lý văn bản", "desc": "LEFT lấy ký tự từ trái, RIGHT lấy từ phải, MID lấy chuỗi ở vị trí tùy chọn.", "syntax": "LEFT(text;num_chars) / RIGHT(text;num_chars) / MID(text;start_num;num_chars)", "why": "Tách tiền tố mã, số thứ tự và phần tên viết tắt của biểu mẫu.", "steps": ["Xác định ô văn bản.", "Chọn vị trí cần lấy: đầu, cuối hay ở giữa.", "Nhập số ký tự và kiểm tra kết quả."], "example": "=LEFT(A2;2) → NV; =RIGHT(A2;3) → 001", "common": "Các hàm làm việc theo ký tự, không tự nhận diện từ hoặc họ tên.", "items": [{"q": "Lấy 2 ký tự đầu mã NV001.", "f": "=LEFT(A2;2)", "guide": "Lấy tiền tố NV."}, {"q": "Lấy 3 ký tự cuối mã NV002.", "f": "=RIGHT(A3;3)", "guide": "Lấy số thứ tự dạng chữ."}, {"q": "Lấy 3 ký tự giữa mã NV003 bắt đầu từ vị trí 3.", "f": "=MID(A4;3;3)", "guide": "Vị trí 3 là chữ số 0 đầu tiên."}, {"q": "Lấy 2 ký tự đầu mã NV004.", "f": "=LEFT(A5;2)", "guide": "LEFT từ bên trái."}, {"q": "Lấy 1 ký tự cuối mã NV005.", "f": "=RIGHT(A6;1)", "guide": "RIGHT lấy một ký tự."}, {"q": "Lấy 2 ký tự từ vị trí 3 của NV006.", "f": "=MID(A7;3;2)", "guide": "MID lấy vị trí thứ 3 và 4."}, {"q": "Lấy 3 ký tự cuối mã NV007.", "f": "=RIGHT(A8;3)", "guide": "Giữ số 0 đầu vì trả văn bản."}, {"q": "Lấy 4 ký tự đầu mã NV008.", "f": "=LEFT(A9;4)", "guide": "Nhận NV00."}, {"q": "Lấy 2 ký tự từ vị trí 4 của NV009.", "f": "=MID(A10;4;2)", "guide": "Nhận 00 hoặc phần số phù hợp vị trí."}, {"q": "Lấy 2 ký tự cuối mã NV012.", "f": "=RIGHT(A13;2)", "guide": "RIGHT với 2 ký tự."}]}, {"id": "concat", "name": "CONCAT – & – TEXT", "group": "Xử lý văn bản", "desc": "Ghép văn bản bằng CONCAT hoặc toán tử &. TEXT định dạng số/ngày thành chữ theo mẫu.", "syntax": "CONCAT(text1;text2;…) / text1 & text2 / TEXT(value;format_text)", "why": "Tạo nhãn báo cáo, mô tả nhân viên và mã hiển thị trong biểu mẫu.", "steps": ["Chọn các ô cần ghép.", "Bổ sung dấu cách, dấu gạch nối đặt trong ngoặc kép.", "Dùng TEXT nếu muốn hiển thị số với định dạng cụ thể."], "example": "=B2&\" - \"&C2 → Nguyễn An - Đào tạo", "common": "Hàm TEXT dùng mã định dạng theo thiết lập Excel; ký hiệu ngày có thể khác giữa các phiên bản/ngôn ngữ.", "items": [{"q": "Ghép tên và bộ phận NV001, ngăn cách \" - \".", "f": "=B2&\" - \"&C2", "guide": "Dùng toán tử &."}, {"q": "Ghép mã và tên NV002.", "f": "=A3&\" | \"&B3", "guide": "Chèn dấu phân cách."}, {"q": "Ghép tên và khu vực NV003 bằng CONCAT.", "f": "=CONCAT(B4;\" - \";H4)", "guide": "CONCAT nhận nhiều phần văn bản."}, {"q": "Tạo nhãn \"Nhân viên: \" + tên NV004.", "f": "=CONCAT(\"Nhân viên: \";B5)", "guide": "Nội dung cố định đặt trong nháy kép."}, {"q": "Ghép mã NV005 và bộ phận.", "f": "=A6&\" / \"&C6", "guide": "Dùng & với ba thành phần."}, {"q": "Ghép tên và trạng thái NV006.", "f": "=CONCAT(B7;\" (\";M7;\")\")", "guide": "Chú ý dấu ngoặc trong phần văn bản."}, {"q": "Hiển thị lương NV007 với dấu phân cách nghìn bằng TEXT.", "f": "=TEXT(E8;\"#,##0\")", "guide": "TEXT định dạng số thành văn bản."}, {"q": "Ghép \"Điểm Excel: \" và điểm NV008.", "f": "=CONCAT(\"Điểm Excel: \";I9)", "guide": "CONCAT tự chuyển điểm thành chữ."}, {"q": "Ghép mã và 3 số cuối NV009.", "f": "=CONCAT(A10;\"-\";RIGHT(A10;3))", "guide": "Có thể lồng RIGHT trong CONCAT."}, {"q": "Tạo chuỗi Tên | Bộ phận | Khu vực của NV012.", "f": "=B13&\" | \"&C13&\" | \"&H13", "guide": "Ghép nhiều ô bằng &."}]}, {"id": "date", "name": "TODAY – DATE – YEAR – MONTH", "group": "Ngày tháng", "desc": "TODAY lấy ngày hiện tại; DATE tạo một ngày theo năm, tháng, ngày; YEAR/MONTH tách năm, tháng từ ngày hợp lệ.", "syntax": "TODAY() / DATE(year;month;day) / YEAR(serial_number) / MONTH(serial_number)", "why": "Theo dõi niên hạn, thâm niên, mốc nhận việc; phù hợp quản trị nhân sự.", "steps": ["Đảm bảo cột K là kiểu Date (ngày) trong Excel, không phải chuỗi văn bản.", "Dùng TODAY() khi cần ngày hệ thống.", "Dùng DATE, YEAR hoặc MONTH để tạo hoặc tách ngày."], "example": "=YEAR(K2) → năm vào làm của NV001.", "common": "Ngày hiện tại phụ thuộc đồng hồ máy; DATE và phép so sánh yêu cầu ô ngày thật, không phải văn bản.", "items": [{"q": "Lấy ngày hiện tại trên máy.", "f": "=TODAY()", "guide": "Hàm TODAY không có đối số."}, {"q": "Tạo ngày 01/01/2026.", "f": "=DATE(2026;1;1)", "guide": "DATE nhận năm, tháng, ngày."}, {"q": "Lấy năm vào làm NV001.", "f": "=YEAR(K2)", "guide": "K2 phải là ô ngày."}, {"q": "Lấy tháng vào làm NV002.", "f": "=MONTH(K3)", "guide": "Trả số từ 1 đến 12."}, {"q": "Tạo ngày 20/11/2026.", "f": "=DATE(2026;11;20)", "guide": "Thứ tự năm; tháng; ngày."}, {"q": "Lấy năm vào làm NV003.", "f": "=YEAR(K4)", "guide": "Lấy YEAR của K4."}, {"q": "Lấy tháng vào làm NV004.", "f": "=MONTH(K5)", "guide": "Lấy MONTH của K5."}, {"q": "Kiểm tra NV005 vào làm trước 01/01/2025.", "f": "=IF(K6<DATE(2025;1;1);\"Trước 2025\";\"Từ 2025\")", "guide": "Lồng DATE vào IF."}, {"q": "Số ngày NV006 làm việc tính đến hôm nay.", "f": "=TODAY()-K7", "guide": "Chênh lệch ngày; định dạng ô kết quả thành số."}, {"q": "Lấy năm của ngày hiện tại.", "f": "=YEAR(TODAY())", "guide": "Lồng TODAY vào YEAR."}]}]}</script><script>
'use strict';const model=JSON.parse(document.getElementById('course-data').textContent);let current='home';let sep=localStorage.getItem('excel_sep')||';';let qfilter='';let currentTab='theory';let finished=new Set(JSON.parse(localStorage.getItem('excel_done')||'[]'));let revealed=new Set();let hints=new Set();
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const formatFormula=s=>sep===';'?s:s.replace(/;/g,',');const fmt=s=>typeof s==='number'?s.toLocaleString('vi-VN'):String(s);const groups=[...new Set(model.lessons.map(x=>x.group))];
function toggleMenu(open){$('side').classList.toggle('open',open);$('overlay').classList.toggle('open',open)}
function renderNav(){let s='<div class="side-group">Điều hướng</div>'+[['home','⌂ Tổng quan'],['data','▦ Dữ liệu thực hành']].map(([id,n])=>`<button class="navitem ${id===current?'active':''}" onclick="showPage('${id}')">${n}</button>`).join('');for(let g of groups){let ls=model.lessons.filter(x=>x.group===g&&(`${x.name} ${x.desc}`).toLowerCase().includes(qfilter));if(!ls.length)continue;s+=`<div class="side-group">${escapeHTML(g)}</div>`+ls.map(x=>`<button class="navitem ${current===x.id?'active':''}" onclick="showPage('${x.id}')"><span>${escapeHTML(x.name)}</span><small>${[...finished].filter(n=>n.startsWith(x.id+':')).length}/10</small></button>`).join('')}if(qfilter&&!model.lessons.some(x=>`${x.name} ${x.desc}`.toLowerCase().includes(qfilter)))s+='<p class="nothing">Không tìm thấy hàm phù hợp.</p>';$('navigation').innerHTML=s}
function save(){localStorage.setItem('excel_done',JSON.stringify([...finished]));renderNav()}
function showPage(id,tab){current=id;currentTab=tab||'theory';revealed.clear();hints.clear();renderNav();toggleMenu(false);renderPage();window.scrollTo({top:0,behavior:'instant'})}
function renderPage(){if(current==='home')return renderHome();if(current==='data')return renderData();const x=model.lessons.find(x=>x.id===current);if(!x)return showPage('home');renderLesson(x)}
function renderHome(){const n=finished.size,total=170;$('content').innerHTML=`<section class="hero"><div class="eyebrow">CHƯƠNG TRÌNH THỰC HÀNH EXCEL</div><h1>Hiểu hàm • Làm đúng • Ứng dụng ngay</h1><p>17 chuyên đề từ cơ bản đến kết hợp; 170 bài tập có gợi ý, công thức tham khảo và hướng dẫn giải. Dữ liệu minh họa gắn với quản lý nhân sự, đào tạo, doanh số và hành chính văn phòng.</p><div class="toolbar"><button class="btn primary" onclick="showPage('sum')">Bắt đầu học SUM →</button><button class="btn" onclick="showPage('data')">Mở bảng dữ liệu</button></div></section><div class="stats"><div class="stat"><b>17</b><span>Chuyên đề hàm</span></div><div class="stat"><b>170</b><span>Bài tập thực hành</span></div><div class="stat"><b>${n}/170</b><span>Đã đánh dấu hoàn thành</span></div></div><section class="card"><h2>Hướng dẫn học và thực hành</h2><ol class="steps"><li>Chọn <b>Dữ liệu thực hành</b> để xem vị trí các ô; tải bảng mẫu hoặc sao chép toàn bộ bảng sang Excel tại ô A1.</li><li>Chọn chuyên đề, đọc <b>Khái niệm – Cú pháp – Các bước thực hiện</b> và xem ví dụ.</li><li>Vào <b>10 bài tập</b>, tự nhập công thức vào Excel, hoặc ô thử công thức trên website để đối chiếu cấu trúc.</li><li>Dùng nút <b>Gợi ý</b> khi cần, sau đó <b>Xem lời giải</b> để kiểm tra và đánh dấu đã hoàn thành.</li></ol><div class="warn"><b>Lưu ý:</b> Website đối chiếu công thức với đáp án tham khảo, không thay thế bộ tính toán của Microsoft Excel. Có thể có nhiều công thức khác nhau cùng cho kết quả đúng.</div><h3>Tiến độ của bạn</h3><div class="progress"><div style="width:${n/total*100}%"></div></div><p class="notice">${Math.round(n/total*100)}% hoàn thành. Tiến độ được lưu trên trình duyệt hiện tại.</p></section><section class="card"><h2>Danh sách chuyên đề</h2><div class="gridcards">${model.lessons.map((x,i)=>`<button class="lessonlink" onclick="showPage('${x.id}')"><span>CHUYÊN ĐỀ ${String(i+1).padStart(2,'0')} • 10 BÀI TẬP</span><b>${escapeHTML(x.name)}</b><span>${escapeHTML(x.desc)}</span></button>`).join('')}</div></section>`}
function renderData(){const n=model.headers.length;let header='<tr><th>Hàng</th>'+model.headers.map((h,i)=>`<th>${String.fromCharCode(65+i)} · ${escapeHTML(h)}</th>`).join('')+'</tr>';let body=model.rows.map((r,i)=>'<tr><td>'+(i+2)+'</td>'+r.map((c,j)=>`<td>${j===10?c.split('-').reverse().join('/'):escapeHTML(fmt(c))}</td>`).join('')+'</tr>').join('');const mh='<tr><th>Hàng</th>'+model.months[0].map((c,i)=>`<th>${String.fromCharCode(80+i)} · ${c}</th>`).join('')+'</tr>';const mb=model.months.map((r,i)=>'<tr><td>'+(10+i)+'</td>'+r.map(c=>`<td>${escapeHTML(fmt(c))}</td>`).join('')+'</tr>').join('');$('content').innerHTML=`<div class="chapter-head"><div><div class="eyebrow" style="color:#2369c3">BỘ DỮ LIỆU DÙNG CHUNG</div><h1>Dữ liệu thực hành Excel</h1><div class="subtext">Bảng mô phỏng cho mục đích học tập, không phải dữ liệu nhân sự thật.</div></div></div><section class="card"><h2>Cách đưa dữ liệu vào Excel</h2><ol class="steps"><li>Nhấn <b>Tải dữ liệu dạng TSV</b> rồi mở tệp bằng Excel, hoặc nhấn <b>Sao chép toàn bộ bảng</b> và dán vào ô <b>A1</b> của một sheet trống.</li><li>Bảng nhân sự chiếm <b>A1:M13</b>. Bảng ngang dành cho HLOOKUP nằm tại <b>P10:U13</b>.</li><li>Đặt định dạng cột K (Ngày vào làm) thành kiểu <b>Date – ngày/tháng/năm</b>. Nếu Excel đọc ngày thành chữ, sử dụng Data → Text to Columns → Date (DMY) để chuyển đổi.</li><li>Đặt tên sheet tùy ý, rồi nhập các công thức trong ô trống của <b>chính sheet đó</b>.</li></ol><div class="data-tools"><button class="btn primary" onclick="downloadTSV()">↓ Tải dữ liệu (.tsv)</button><button class="btn" onclick="copyTSV()">Sao chép toàn bộ bảng</button><button class="btn" onclick="downloadCSV()">↓ Tải CSV nhân sự</button></div><p class="notice">Tệp TSV lưu đúng vị trí các cột A:U, phù hợp cả bảng chính và bảng HLOOKUP. CSV chỉ chứa bảng nhân sự A:M.</p></section><section class="card"><h2>Bảng nhân sự – A1:M13</h2><p>Hàng 1 chứa tiêu đề; hàng 2–13 là 12 nhân viên mô phỏng. Cuộn ngang để xem hết 13 cột.</p><div class="datawrap"><table class="data"><thead>${header}</thead><tbody>${body}</tbody></table></div></section><section class="card"><h2>Bảng ngang – P10:U13</h2><p>Hàng 10: mã tháng; hàng 11: chỉ tiêu doanh số; hàng 12: doanh số thực tế; hàng 13: lượt đăng ký. Dùng bảng này cho 10 bài HLOOKUP.</p><div class="datawrap"><table class="data"><thead>${mh}</thead><tbody>${mb}</tbody></table></div></section>`}
function renderLesson(x){let count=[...finished].filter(n=>n.startsWith(x.id+':')).length;$('content').innerHTML=`<div class="chapter-head"><div><div class="eyebrow" style="color:#2369c3">${escapeHTML(x.group)} · 10 bài tập</div><h1>Hàm ${escapeHTML(x.name)}</h1><p class="subtext">${escapeHTML(x.desc)}</p></div><span class="pill">${count}/10 hoàn thành</span></div><div class="toolbar"><label for="sep">Dấu phân cách công thức</label><select id="sep" onchange="changeSep(this.value)"><option value=";" ${sep===';'?'selected':''}>Chấm phẩy ;</option><option value="," ${sep===','?'selected':''}>Dấu phẩy ,</option></select><button class="btn small" onclick="showPage('data')">▦ Xem bảng dữ liệu</button><button class="btn small" onclick="window.print()">⎙ In bài học</button></div><div class="section-tabs" role="tablist"><button class="tab ${currentTab==='theory'?'active':''}" onclick="setTab('theory')">01. Lý thuyết & ví dụ</button><button class="tab ${currentTab==='practice'?'active':''}" onclick="setTab('practice')">02. Bài tập (10 bài)</button></div><div id="lessonbody"></div><div class="toolbar" style="justify-content:space-between;margin-top:25px"><button class="btn" onclick="adjacent(-1)">← Chuyên đề trước</button><button class="btn primary" onclick="adjacent(1)">Chuyên đề tiếp theo →</button></div>`;renderBody(x)}
function setTab(t){currentTab=t;renderPage();}function adjacent(delta){let i=model.lessons.findIndex(x=>x.id===current);showPage(model.lessons[Math.max(0,Math.min(model.lessons.length-1,i+delta))].id)}function changeSep(value){sep=value;localStorage.setItem('excel_sep',value);renderPage()}

function renderSyntaxHelp(id){const a=syntaxHelp[id]||[];return `<div class="syntax-guide"><h4>📖 Giải thích từng thành phần trong cú pháp</h4>${a.map(([k,v])=>`<div class="param"><code>${escapeHTML(k)}</code><span>${escapeHTML(v)}</span></div>`).join('')}<div class="syntax-tip"><b>Cách đọc:</b> Dấu <b>;</b> ngăn cách các thành phần; dấu <b>:</b> chỉ một vùng ô liên tục (ví dụ A2:A10); phần trong <b>[ ]</b> là có thể bỏ qua. Các từ trong cú pháp chỉ là tên gợi nhớ, khi sử dụng phải thay bằng ô, vùng hoặc giá trị thực tế.</div></div>`}

function renderBody(x){if(currentTab==='theory'){$('lessonbody').innerHTML=`<section class="card"><h2>1. Khái niệm và tác dụng</h2><p>${escapeHTML(x.desc)}</p><h3>Ứng dụng thực tế</h3><p>${escapeHTML(x.why)}</p><h3>2. Cú pháp (cấu trúc công thức)</h3><div class="code">=${escapeHTML(formatFormula(x.syntax))}</div>${renderSyntaxHelp(x.id)}<div class="notice" style="margin-top:9px">Đối số đặt trong [ ] là tùy chọn. Chỉ dùng dấu ; hoặc , theo thiết lập Excel trên máy.</div><h3>3. Hướng dẫn từng bước</h3><ol class="steps">${x.steps.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ol><h3>4. Ví dụ minh họa</h3><div class="code">${escapeHTML(formatFormula(x.example))}</div><div class="warn"><b>Lưu ý thường gặp:</b> ${escapeHTML(x.common)}</div><div class="toolbar"><button class="btn primary" onclick="setTab('practice')">Làm 10 bài tập →</button><button class="btn" onclick="showPage('data')">Xem dữ liệu mẫu</button></div></section>`;return}
$('lessonbody').innerHTML=`<section class="card"><h2>10 bài tập thực hành – ${escapeHTML(x.name)}</h2><p>Thực hiện trên bảng dữ liệu mẫu. Nhập thử công thức vào ô kiểm tra hoặc thực hành trực tiếp trong Excel. Nhấn Gợi ý khi cần; chỉ mở lời giải sau khi đã tự làm.</p><div class="progress"><div style="width:${[...finished].filter(n=>n.startsWith(x.id+':')).length*10}%"></div></div><div class="data-tools"><button class="btn small" onclick="allAnswers(true)">Hiện tất cả lời giải</button><button class="btn small" onclick="allAnswers(false)">Ẩn lời giải</button><button class="btn small" onclick="showPage('data')">Mở bảng dữ liệu</button></div><div id="exercises"></div></section>`;let s='';x.items.forEach((item,i)=>{const key=x.id+':'+i,done=finished.has(key),vis=revealed.has(key),hint=hints.has(key);s+=`<div class="exercise" id="ex-${i}"><div class="exercise-head"><span class="num">${String(i+1).padStart(2,'0')}</span><div style="flex:1"><h3>Bài ${i+1}. ${escapeHTML(item.q)}</h3><div class="notice">Dữ liệu tại sheet thực hành • ${done?'<span class="tick">✓ Đã hoàn thành</span>':'Tự viết công thức trước khi xem đáp án'}</div></div></div><div class="actions"><input type="text" id="entry-${i}" spellcheck="false" autocomplete="off" placeholder="Nhập công thức bắt đầu bằng =" aria-label="Công thức bài ${i+1}"><button class="btn small" onclick="checkAnswer(${i})">Kiểm tra</button><button class="btn small" onclick="toggleHint(${i})">${hint?'Ẩn':'Gợi ý'}</button><button class="btn small" onclick="toggleAnswer(${i})">${vis?'Ẩn':'Xem'} lời giải</button></div><div class="feedback" id="feedback-${i}" style="margin-left:42px"></div><div class="hint ${hint?'open':''}" id="hint-${i}"><b>Gợi ý:</b> ${escapeHTML(item.guide)}</div><div class="solution ${vis?'open':''}" id="sol-${i}"><div class="lead">Công thức tham khảo</div><div class="code" id="form-${i}">${escapeHTML(formatFormula(item.f))}</div><p><b>Giải thích:</b> ${escapeHTML(item.guide)}</p><div class="data-tools"><button class="btn small" onclick="copyFormula(${i})">Sao chép công thức</button><button class="btn small ${done?'':'primary'}" onclick="markDone(${i})">${done?'✓ Đã hoàn thành':'✓ Đánh dấu hoàn thành'}</button></div></div></div>`});$('exercises').innerHTML=s}
function checkAnswer(i){const x=model.lessons.find(x=>x.id===current),user=$('entry-'+i).value,correct=x.items[i].f;const norm=s=>s.trim().replace(/\s+(?=(?:[^"]*"[^"]*")*[^"]*$)/g,'').replace(/;/g,',').toUpperCase();let ok=norm(user)===norm(correct);$('feedback-'+i).innerHTML=user.trim()?ok?'<span class="tick">✓ Trùng với công thức mẫu. Hãy kiểm tra kết quả trên Excel.</span>':'<span style="color:#a75e16">Chưa trùng công thức mẫu. Xem gợi ý hoặc đối chiếu kết quả trong Excel; công thức khác vẫn có thể đúng.</span>':'<span style="color:#a75e16">Hãy nhập công thức để kiểm tra.</span>';if(ok){finished.add(x.id+':'+i);save()}}
function toggleHint(i){let key=current+':'+i;if(hints.has(key))hints.delete(key);else hints.add(key);$('hint-'+i).classList.toggle('open',hints.has(key))}
function toggleAnswer(i){let key=current+':'+i;if(revealed.has(key))revealed.delete(key);else revealed.add(key);$('sol-'+i).classList.toggle('open',revealed.has(key))}
function allAnswers(value){let x=model.lessons.find(x=>x.id===current);x.items.forEach((_,i)=>{let key=current+':'+i;if(value)revealed.add(key);else revealed.delete(key);$('sol-'+i).classList.toggle('open',value)})}
function markDone(i){let key=current+':'+i;if(finished.has(key))finished.delete(key);else finished.add(key);save();renderPage()}
async function safeCopy(s){try{await navigator.clipboard.writeText(s);alert('Đã sao chép.')}catch(err){let el=document.createElement('textarea');el.value=s;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();alert('Đã sao chép.')}}
function copyFormula(i){let x=model.lessons.find(x=>x.id===current);safeCopy(formatFormula(x.items[i].f))}
function layoutTSV(){let lines=[];for(let ri=1;ri<=13;ri++){let line=Array(21).fill('');if(ri===1)line.splice(0,13,...model.headers);else{let row=[...model.rows[ri-2]];row[10]=row[10].split('-').reverse().join('/');line.splice(0,13,...row)}if(ri>=10)line.splice(15,6,...model.months[ri-10]);lines.push(line.join('\t'))}return lines.join('\r\n')}
function csvQuote(v){return '"'+String(v).replace(/"/g,'""')+'"'}function csvContent(){return [model.headers,...model.rows].map(r=>r.map(csvQuote).join(',')).join('\r\n')}
function downloadText(name,body,type){let blob=new Blob(['\ufeff'+body],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function downloadTSV(){downloadText('Du_lieu_thuc_hanh_Excel_A_den_U.tsv',layoutTSV(),'text/tab-separated-values')}function downloadCSV(){downloadText('Danh_sach_nhan_su_mau.csv',csvContent(),'text/csv')}function copyTSV(){safeCopy(layoutTSV())}
$('search').addEventListener('input',e=>{qfilter=e.target.value.trim().toLowerCase();renderNav()});renderNav();renderPage();
</script></body></html>
